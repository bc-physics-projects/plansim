[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "plansim"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "polars~=2.1.0",
    "numpy~=2.5.5",
    "matplotlib~=3.10.8",
    "astroquery~=0.4.11",
    "astropy~=8.0.3",
]
dynamic = ["version"]

[tool.maturin]
profile = "dev"                                                         # Explicitly add --release for optimizations
pgo-command = "python horizons_solar_system_15.py --days 365 --no-plot"
include = [{ path = "horizons_solar_system_15.py", format = "sdist" }]
