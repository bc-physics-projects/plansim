[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "plansim"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "lsq-ellipse>=2.2.1",
]
dynamic = ["version"]

