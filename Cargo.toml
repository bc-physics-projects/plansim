[package]
name = "plansim"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "plansim"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
differential-equations = { version = "0.7.0", features = [
    "nalgebra",
    "polars",
] }
nalgebra = "0.35.0"
paste = "1.0.15"
pyo3 = "0.29.0"
seq-macro = "0.3.6"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# Keep symbols when investigating native CPU profiles.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
