[package]
name = "plansim"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "plansim"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
nalgebra = "0.34.2"
ode_solvers = "0.6.2"
paste = "1.0.15"
pyo3 = "0.29.0"
seq-macro = "0.3.6"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
