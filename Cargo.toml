[package]
name = "plansim"
version = "0.1.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "plansim"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
differential-equations = { version = "0.7.0", features = [
    "nalgebra",
    "polars",
] }
nalgebra = "0.35.0"
paste = "1.0.15"
pyo3 = "0.29.0"
polars = { version = "0.55.2", default-features = false, features = [
    "dtype-struct",
] }
pyo3-polars = { version = "0.28.0", features = ["dtype-struct"] }
seq-macro = "0.3.6"
ctrlc = "3.5.2"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# Keep symbols when investigating native CPU profiles.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.dev]
codegen-units = 256
debug = "line-tables-only"
opt-level = 0
lto = false
